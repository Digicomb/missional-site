name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# This writes a heartbeat row in the shared Digicomb project every 6 hours.
# A second copy runs from Digicomb/digitalhoneycomb-site at a different time,
# so one repo's skipped or delayed schedule can't let the project pause.
# GitHub's schedules are best effort (runs are often late or skipped), hence the
# frequency: either repo alone gives several attempts a day.

on:
  schedule:
    - cron: '17 */6 * * *' # Every 6 hours at :17 (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch:

permissions:
  actions: write # lets the job re-enable itself (see last step)

env:
  # Public, browser-safe values (same as src/config.ts).
  SUPABASE_URL: https://trpfvlxoxsprjzenuhti.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_bCCBqRlktzqNmxtHXv2gRQ_NBcW0Qgr
  HEARTBEAT_SOURCE: missional-site

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          ping() {
            curl -sS -o response.txt -w '%{http_code}' --max-time 30 --retry 3 --retry-all-errors \
              -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              -H "Content-Type: application/json" \
              -d "$1"
          }
          status=$(ping "{\"source\": \"$HEARTBEAT_SOURCE\"}")
          # Fallback for the older keep_alive() that takes no arguments.
          if [ "$status" != 200 ]; then
            echo "HTTP $status with source: $(cat response.txt); retrying without it"
            status=$(ping '{}')
          fi
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = 200

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repository activity. Re-enabling the workflow resets that clock.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
